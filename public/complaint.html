
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Vijrumbhana - Complaint</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f8;
    color: #172033;
}

header {
    background: linear-gradient(120deg, #101b35, #2454d5);
    color: white;
    text-align: center;
    padding: 35px 15px;
}

nav {
    background: #101b35;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
    font-weight: bold;
    display: inline-block;
    padding: 5px 0;
}

.container {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0001;
}

h2 { color: #2454d5; }

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ccd3df;
    border-radius: 6px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

input[type="file"] {
    background: #f7f9fc;
}

small {
    display: block;
    margin-top: 7px;
    color: #657087;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    background: #2454d5;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    cursor: pointer;
}

button:hover { background: #183fae; }

button:disabled {
    background: #8796b7;
    cursor: not-allowed;
}

#message {
    margin-top: 15px;
    font-weight: bold;
}

.hidden {
    display: none;
}

footer {
    background: #101b35;
    color: white;
    text-align: center;
    padding: 20px;
}

@media (max-width: 600px) {
    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .card {
        padding: 20px;
    }

    nav a {
        margin: 5px 8px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>TEAM VIJRUMBHANA</h1>
    <p>Complaint Submission Portal</p>
</header>

<nav>
    <a href="/">Home</a>
    <a href="/membership.html">Membership</a>
    <a href="/complaint.html">Submit Complaint</a>
    <a href="/admin.html">Admin</a>
</nav>

<div class="container">
<div class="card">

<h2>Submit Your Complaint</h2>

<p>Please provide the following details to submit your complaint.</p>

<form id="complaintForm" enctype="multipart/form-data">

    <label>Full Name</label>
    <input type="text" name="name" placeholder="Enter your full name" required>

    <label>Mobile Number</label>
    <input
        type="tel"
        name="mobile"
        pattern="[0-9]{10}"
        maxlength="10"
        placeholder="Enter 10-digit mobile number"
        required
    >

    <label>Institution Type</label>
    <select name="institutionType" id="institutionType" required>
        <option value="">Select Institution Type</option>
        <option value="School">School</option>
        <option value="College">College</option>
    </select>

    <label>School / College Name</label>
    <input
        type="text"
        name="institutionName"
        placeholder="Enter school or college name"
        required
    >

    <label>Address</label>
    <textarea
        name="address"
        rows="3"
        placeholder="Enter complete address"
        required
    ></textarea>

    <!-- School Details -->
    <div id="schoolFields" class="hidden">

        <label>Class</label>
        <select name="className" id="className">
            <option value="">Select Class</option>
            <option>1st Class</option>
            <option>2nd Class</option>
            <option>3rd Class</option>
            <option>4th Class</option>
            <option>5th Class</option>
            <option>6th Class</option>
            <option>7th Class</option>
            <option>8th Class</option>
            <option>9th Class</option>
            <option>10th Class</option>
        </select>

        <label>Section</label>
        <input
            type="text"
            name="section"
            id="section"
            placeholder="Enter section"
        >

    </div>

    <!-- College Details -->
    <div id="collegeFields" class="hidden">

        <label>Course Name</label>
        <input
            type="text"
            name="courseName"
            id="courseName"
            placeholder="Example: B.Tech Mechanical Engineering"
        >

    </div>

    <label>Complaint Category</label>
    <select name="category" required>
        <option value="">Select Category</option>
        <option>Roads</option>
        <option>Water</option>
        <option>Sanitation</option>
        <option>Electricity</option>
        <option>Drainage</option>
        <option>Public Services</option>
        <option>Education</option>
        <option>Other</option>
    </select>

    <label>Complaint Description</label>
    <textarea
        name="description"
        rows="5"
        placeholder="Explain your complaint in detail"
        required
    ></textarea>

    <label>Upload Photo / Video (Optional)</label>
    <input
        type="file"
        name="attachment"
        id="attachment"
        accept="image/*,video/*"
    >

    <small>
        Upload a photo or video if needed.
        This field is completely optional.
    </small>

    <button type="submit" id="submitButton">
        Submit Complaint
    </button>

</form>

<div id="message"></div>

</div>
</div>

<footer>
    © 2026 Team Vijrumbhana | Community Service Portal
</footer>

<script>

// Show School or College fields

const institutionType = document.getElementById("institutionType");

const schoolFields = document.getElementById("schoolFields");
const collegeFields = document.getElementById("collegeFields");

const className = document.getElementById("className");
const section = document.getElementById("section");
const courseName = document.getElementById("courseName");

institutionType.addEventListener("change", function() {

    schoolFields.classList.add("hidden");
    collegeFields.classList.add("hidden");

    className.required = false;
    section.required = false;
    courseName.required = false;

    if (this.value === "School") {

        schoolFields.classList.remove("hidden");

        className.required = true;
        section.required = true;

    } else if (this.value === "College") {

        collegeFields.classList.remove("hidden");

        courseName.required = true;
    }
});


// Submit Complaint

document.getElementById("complaintForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    button.disabled = true;
    button.textContent = "Submitting...";
    message.textContent = "";

    // FormData supports optional file uploads
    const formData = new FormData(this);

    try {

        const response = await fetch("/api/complaint", {
            method: "POST",
            body: formData
        });

        const result = await response.json();

        if (response.ok && result.success) {

            message.style.color = "green";
            message.textContent =
                "Complaint submitted successfully!";

            this.reset();

            schoolFields.classList.add("hidden");
            collegeFields.classList.add("hidden");

        } else {

            message.style.color = "red";

            message.textContent =
                result.message || "Complaint submission failed.";

        }

    } catch (error) {

        message.style.color = "red";

        message.textContent =
            "Server error. Please try again.";

    }

    button.disabled = false;
    button.textContent = "Submit Complaint";

});

</script>

</body>
</html>
